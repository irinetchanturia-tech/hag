<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ირინა & გიორგი | ქორწილი</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Playfair Display',serif;}

body{
  background:#f7f2ea;
  color:#3a3a3a;
  overflow-x:hidden;
}

/* ✨ SPARKLE LAYER */
.sparkle{
  position:fixed;
  width:100vw;
  height:100vh;
  top:0;
  left:0;
  pointer-events:none;
  z-index:0;
}

.sparkle span{
  position:absolute;
  width:4px;
  height:4px;
  background:white;
  border-radius:50%;
  opacity:0;
  animation:twinkle 6s infinite ease-in-out;
  box-shadow:0 0 8px rgba(255,255,255,0.8);
}

@keyframes twinkle{
  0%{opacity:0;transform:scale(0);}
  50%{opacity:0.8;transform:scale(1.5);}
  100%{opacity:0;transform:scale(0);}
}

/* HERO */
.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  position:relative;
  background:linear-gradient(180deg,#fff,#f3eadf);
  overflow:hidden;
  z-index:1;
}

.hero h1{
  font-family:'Great Vibes',cursive;
  font-size:72px;
  background:linear-gradient(45deg,#b08d57,#6b4f2a);
  -webkit-background-clip:text;
  color:transparent;
  position:relative;
  z-index:3;
}

.hero p{
  margin-top:10px;
  font-size:18px;
  opacity:.8;
  z-index:3;
}

/* ❤️ HEARTS */
.heart-red{
  position:absolute;
  color:#ff2d55;
  font-size:18px;
  animation:floatHeart 10s linear infinite;
  opacity:0.6;
  z-index:2;
}

@keyframes floatHeart{
  0%{transform:translateY(100vh) scale(0.6);}
  100%{transform:translateY(-10vh) scale(1.2);}
}

/* 🌹 PETALS */
.petal{
  position:absolute;
  top:-10vh;
  width:14px;
  height:22px;
  background:linear-gradient(135deg,#ff4d7d,#ff2d55);
  border-radius:80% 20% 70% 30%;
  opacity:0.75;
  animation:fall linear infinite, sway ease-in-out infinite;
  z-index:1;
}

@keyframes fall{
  0%{transform:translateY(-10vh) rotate(0deg);}
  100%{transform:translateY(110vh) rotate(360deg);}
}

@keyframes sway{
  0%{margin-left:0px;}
  50%{margin-left:35px;}
  100%{margin-left:0px;}
}

/* SECTIONS */
section{
  padding:80px 20px;
  text-align:center;
  position:relative;
  z-index:1;
}

h2{
  font-size:28px;
  margin-bottom:20px;
  color:#b08d57;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.75);
  backdrop-filter:blur(10px);
  padding:20px;
  border-radius:15px;
  max-width:420px;
  margin:20px auto;
  border:1px solid rgba(0,0,0,0.05);
}

/* BUTTON */
button{
  background:#b08d57;
  color:#fff;
  padding:10px 15px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

/* MUSIC */
#musicBtn{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#b08d57;
  padding:12px;
  border-radius:50%;
  color:#fff;
  border:none;
  z-index:10;
}
</style>
</head>

<body>

<!-- ✨ SPARKLES -->
<div class="sparkle" id="sparkle"></div>

<!-- HERO -->
<div class="hero">
  <h1>ირინა & გიორგი</h1>
  <p>გიწვევთ ქორწილში</p>
  <p>13 სექტემბერი, 2026 • ზუგდიდი, ბაგრატიონი</p>
</div>

<!-- ❤️ HEARTS + 🌹 PETALS -->
<script>
/* hearts */
for(let i=0;i<20;i++){
  let h=document.createElement("div");
  h.className="heart-red";
  h.innerHTML="❤";
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(5+Math.random()*8)+"s";
  document.body.appendChild(h);
}

/* petals */
for(let i=0;i<35;i++){
  let p=document.createElement("div");
  p.className="petal";
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(6+Math.random()*10)+"s";
  document.body.appendChild(p);
}

/* ✨ sparkles */
const sparkleContainer=document.getElementById("sparkle");
for(let i=0;i<60;i++){
  let s=document.createElement("span");
  s.style.top=Math.random()*100+"vh";
  s.style.left=Math.random()*100+"vw";
  s.style.animationDelay=Math.random()*6+"s";
  s.style.animationDuration=(3+Math.random()*4)+"s";
  sparkleContainer.appendChild(s);
}
</script>

<!-- DETAILS -->
<section>
  <h2>დეტალები</h2>
  <div class="card">
    <p>გელოდებით ამ განსაკუთრებულ დღეს თქვენთან ერთად 💍</p>
  </div>
</section>

<!-- STORY -->
<section>
  <h2>ჩვენი ისტორია</h2>
  <div class="card">
    <p>ერთი შეხვედრიდან — სამუდამო სიყვარულამდე ❤️</p>
  </div>
</section>

<!-- RSVP -->
<section>
  <h2>დადასტურება (RSVP)</h2>
  <div class="card">
    <input placeholder="თქვენი სახელი"/>
    <button onclick="alert('მადლობა! 💛')">დადასტურება</button>
  </div>
</section>

<!-- MUSIC -->
<button id="musicBtn" onclick="toggleMusic()">🎵</button>

<audio id="audio" loop>
  <source src="https://cdn.pixabay.com/audio/2022/10/30/audio_5c7c3c7c8b.mp3" type="audio/mpeg">
</audio>

<script>
let playing=false;
function toggleMusic(){
  let audio=document.getElementById("audio");
  if(!playing){audio.play();playing=true;}
  else{audio.pause();playing=false;}
}
</script>

</body>
</html>
